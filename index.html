<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New Discord — Equations, Variables & Math</title>
    <meta name="description" content="Master algebra concepts, linear equations, and mathematical variables with our comprehensive study tools and practice modules.">
    <meta name="keywords" content="Algebra, Algebra lessons, Algebra practice, Equations, Linear equations, Variables, Mathematics, Math learning, Algebra study">
    <meta property="og:title" content="The New Discord">
    <meta property="og:description" content="Learn algebra, linear equations, and mathematics today.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The New Discord">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="brand-title">The New Discord</div>
        <div id="auth-box" class="glass">
            <h2 id="auth-header">Log In</h2>
            <input type="text" id="auth-username" placeholder="Username (3-16 chars)" autocomplete="off">
            <input type="password" id="auth-password" placeholder="Password">
            <button id="auth-action-btn" class="primary-btn">Log In</button>
            <div id="auth-error" class="error-text"></div>
            <div class="toggle-auth">
                <span id="auth-toggle-text">Need an account?</span> 
                <a href="#" id="auth-toggle-link">Sign Up</a>
            </div>
        </div>
    </div>

    <div id="blocked-screen" class="screen hidden">
        <div class="glass blocked-card">
            <h1>Access Denied</h1>
            <p>Your account has been blocked by moderators.</p>
        </div>
    </div>

    <div id="app-screen" class="screen hidden">
        <div id="broadcast-banner" class="hidden"></div>
        
        <div class="app-layout">
            <div class="sidebar glass">
                <div class="sidebar-header">Workspaces</div>
                <div class="channels">
                    <div class="channel-item active" data-channel="general"># general</div>
                    <div class="channel-item" data-channel="random"># random</div>
                    <div class="channel-item hidden" data-channel="staff" id="chan-staff">staff-chat</div>
                </div>
                
                <div class="user-panel">
                    <img id="my-avatar" class="avatar clickable" title="Click to change avatar">
                    <div class="user-info">
                        <span id="my-name" class="name">User</span>
                        <span id="my-role" class="role-badge"></span>
                    </div>
                    <div class="user-actions">
                        <button id="btn-profile" class="text-action-btn" title="Edit Profile">Settings</button>
                        <button id="btn-logout" class="text-action-btn">Logout</button>
                    </div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header glass">
                    <span id="current-channel-name"># general</span>
                    <div id="staff-controls" class="hidden">
                        <button id="btn-mod-users" class="mod-btn">Users</button>
                        <button id="btn-mod-requests" class="mod-btn">Requests <span id="req-dot" class="dot hidden"></span></button>
                        <button id="btn-mod-broadcast" class="mod-btn hidden">Broadcast</button>
                    </div>
                </div>

                <div id="chat-messages" class="messages-container"></div>

                <div class="message-input-area glass">
                    <div id="reply-preview" class="hidden">
                        <span>Replying to <strong id="reply-to-name"></strong>: "<span id="reply-to-text"></span>"</span>
                        <button id="btn-cancel-reply" class="text-action-btn">Cancel</button>
                    </div>
                    <div class="input-wrapper">
                        <input type="file" id="file-upload" class="hidden">
                        <button id="btn-upload" class="text-action-btn" aria-label="Upload File">Upload</button>
                        <textarea id="msg-input" placeholder="Type a message..." rows="1"></textarea>
                        <button id="btn-send" class="primary-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="hidden"></div>

    <div id="modal-profile" class="modal glass hidden">
        <button class="close-modal">✕</button>
        <h3>Edit Profile</h3>
        <input type="text" id="edit-display-name" placeholder="Display Name">
        <textarea id="edit-bio" placeholder="Bio..." rows="3"></textarea>
        <button id="btn-save-profile" class="primary-btn">Save Changes</button>
    </div>

    <div id="modal-view-user" class="modal glass hidden">
        <button class="close-modal">✕</button>
        <div class="profile-card">
            <img id="view-user-avatar" class="avatar large">
            <h2 id="view-user-display">Name</h2>
            <p id="view-user-username" class="text-muted">@username</p>
            <span id="view-user-role" class="role-badge"></span>
            <p id="view-user-bio" style="margin-top: 10px;"></p>
            <div id="view-user-mod-actions" class="mod-actions-grid hidden"></div>
        </div>
    </div>

    <div id="modal-user-manager" class="modal glass hidden">
        <button class="close-modal">✕</button>
        <h3>User Management</h3>
        <input type="text" id="search-users" placeholder="Search users...">
        <div id="user-search-results" class="results-list"></div>
    </div>

    <div id="modal-broadcast" class="modal glass hidden">
        <button class="close-modal">✕</button>
        <h3>Send Broadcast</h3>
        <input type="text" id="broadcast-msg" placeholder="Announcement message...">
        <input type="number" id="broadcast-duration" placeholder="Duration (seconds)" value="10" min="3" max="20">
        <button id="btn-send-broadcast" class="primary-btn">Broadcast</button>
    </div>

    <div id="modal-block-req" class="modal glass hidden">
        <button class="close-modal">✕</button>
        <h3>Request Block</h3>
        <textarea id="block-req-reason" placeholder="Reason for blocking user..." rows="3"></textarea>
        <button id="btn-submit-block-req" class="primary-btn">Submit Request</button>
    </div>

    <div id="modal-req-list" class="modal glass hidden">
        <button class="close-modal">✕</button>
        <h3>Pending Block Requests</h3>
        <div id="req-list-container" class="results-list"></div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
